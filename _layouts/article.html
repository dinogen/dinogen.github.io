---
layout: default
---
<article>
  <p class="eyebrow">{{ page.format | default: "article" }}{% if page.status %} · {{ page.status }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  {% if page.date %}<p class="article-date">{{ page.date | date: "%B %-d, %Y" }}</p>{% endif %}
  <div class="article-body">
    {{ content }}
  </div>
  {% if page.topics %}
    <p class="topics">Topics: {{ page.topics | join: ", " }}</p>
  {% endif %}
</article>
